<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>@marianmeres/vanilla-ui — gallery</title>
		<link rel="icon" href="data:," />

		<!--
			THE GALLERY is the kit's living test suite and its documentation: every
			component, in every state, on every theme. Serve the repo root and open
			this file over http:// (components are fetched; file:// won't work):

			  deno task build      # bundles src/mod.ts -> dist/mod.js (once)
			  deno task serve      # http://localhost:4507/gallery/
		-->

		<!-- ONE theme file is active at a time; the picker swaps this href.
		     Files are generated by `deno task themes:build`. -->
		<link rel="stylesheet" id="theme-link" href="./themes/zinc.css" />

		<!--
			IMPORT MAP — the one host-level requirement. Both bare specifiers point at
			the SAME built file: the components import "@marianmeres/vanilla", the page
			imports "@marianmeres/vanilla-ui" (which re-exports vanilla) — one copy.
		-->
		<script type="importmap">
		{
			"imports": {
				"@marianmeres/vanilla": "../dist/mod.js",
				"@marianmeres/vanilla-ui": "../dist/mod.js"
			}
		}
		</script>

		<!-- restore theme + light/dark BEFORE first paint (no flash) -->
		<script>
		(function () {
			var saved = null;
			try {
				saved = JSON.parse(localStorage.getItem("vui-gallery-theme") || "null");
			} catch (_) {}
			var dark = saved ? !!saved.dark : matchMedia("(prefers-color-scheme: dark)").matches;
			document.documentElement.classList.toggle("dark", dark);
			if (saved && saved.file) {
				document.getElementById("theme-link").setAttribute(
					"href",
					"./themes/" + saved.file,
				);
			}
		})();
		</script>

		<style>
		/* Gallery chrome only — components bring their own @scope'd styles. */
		:root {
			color-scheme: light;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		}
		:root.dark {
			color-scheme: dark;
		}
		body {
			margin: 0;
			background: var(--vui-color-background, Canvas);
			color: var(--vui-color-foreground, CanvasText);
			line-height: 1.5;
		}
		.wrap {
			max-width: 52rem;
			margin: 0 auto;
			padding: 2rem 1.25rem 4rem;
		}
		header.top {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 1rem;
			flex-wrap: wrap;
			margin-bottom: 2rem;
		}
		header.top h1 {
			margin: 0;
			font-size: 1.5rem;
		}
		header.top p {
			margin: 0.25rem 0 0;
			color: var(--vui-color-muted-foreground, GrayText);
		}
		.controls {
			display: flex;
			gap: 0.5rem;
			align-items: center;
		}
		section.component {
			padding: 1.5rem;
			margin-bottom: 1.5rem;
			border: 1px solid var(--vui-color-border, color-mix(in srgb, CanvasText 15%,
				transparent));
			border-radius: 0.75rem;
			background: var(--vui-color-muted, color-mix(in srgb, CanvasText 4%, Canvas));
		}
		section.component h2 {
			margin: 0 0 0.25rem;
			font-size: 1.125rem;
		}
		section.component > p {
			margin: 0 0 1rem;
			color: var(--vui-color-muted-foreground, GrayText);
			font-size: 0.925rem;
		}
		.row {
			display: flex;
			flex-wrap: wrap;
			gap: 0.5rem;
			margin-bottom: 1rem;
		}
		/* generic buttons for the gallery + dialog footers */
		button,
		select {
			font: inherit;
			cursor: pointer;
			padding: 0.45rem 0.9rem;
			border-radius: 0.5rem;
			border: 1px solid var(--vui-color-border, color-mix(in srgb, CanvasText 20%,
				transparent));
			background: var(--vui-color-surface, ButtonFace);
			color: var(--vui-color-surface-foreground, ButtonText);
		}
		button:hover {
			background: var(--vui-color-surface-hover, color-mix(in srgb, CanvasText 8%,
				ButtonFace));
		}
		/* inside a dialog the surface IS the background — lift buttons one step */
		.vui-dialog__footer button {
			background: var(--vui-color-surface-1, ButtonFace);
			color: var(--vui-color-surface-1-foreground, ButtonText);
			border-color: var(--vui-color-surface-1-hover, transparent);
		}
		.vui-dialog__footer button:hover {
			background: var(--vui-color-surface-1-hover, ButtonFace);
		}
		button.primary,
		.vui-dialog__footer button.primary {
			border-color: transparent;
			background: var(--vui-color-primary, AccentColor);
			color: var(--vui-color-primary-foreground, AccentColorText);
		}
		button.primary:hover {
			background: var(--vui-color-primary-hover, AccentColor);
		}
		button:focus-visible,
		select:focus-visible,
		input:focus-visible {
			outline: 2px solid var(--vui-color-ring, Highlight);
			outline-offset: 1px;
		}
		input[type="text"] {
			font: inherit;
			padding: 0.45rem 0.6rem;
			border-radius: 0.5rem;
			border: 1px solid var(--vui-color-border, GrayText);
			background: var(--vui-color-input, Field);
			color: var(--vui-color-foreground, FieldText);
			width: 100%;
			box-sizing: border-box;
		}
		label {
			display: block;
			margin-bottom: 0.35rem;
			font-size: 0.925rem;
		}
		pre.log {
			margin: 0;
			padding: 0.75rem 1rem;
			min-height: 3.5rem;
			max-height: 12rem;
			overflow: auto;
			font-size: 0.8rem;
			border-radius: 0.5rem;
			background: var(--vui-color-surface, Canvas);
			color: var(--vui-color-surface-foreground, CanvasText);
			border: 1px solid var(--vui-color-border, transparent);
		}
		pre.log:empty::before {
			content: "events will show up here…";
			color: var(--vui-color-muted-foreground, GrayText);
		}
		/* the nested demo component (also styled via @scope, like a real one) */
		@scope (.demo-counter) {
			:scope {
				display: flex;
				align-items: center;
				gap: 0.75rem;
				padding: 0.75rem 1rem;
				margin-top: 1rem;
				border-radius: 0.5rem;
				border: 1px dashed var(--vui-color-border, GrayText);
			}
			output {
				font-variant-numeric: tabular-nums;
				font-weight: 600;
				min-width: 2ch;
				text-align: center;
			}
		}
		</style>
	</head>
	<body>
		<div class="wrap">
			<header class="top">
				<div>
					<h1>@marianmeres/vanilla-ui</h1>
					<p>gallery · every component, every state, every theme</p>
				</div>
				<div class="controls">
					<select id="theme-select" aria-label="Theme"></select>
					<button id="dark-toggle" type="button">toggle dark</button>
				</div>
			</header>

			<!-- ================================================================ dialog -->
			<section class="component" id="dialog">
				<h2>dialog</h2>
				<p>
					Native <code>&lt;dialog&gt;</code>: top layer, backdrop, focus trap, Esc, focus
					restore. Close with ✕, Esc, the backdrop, or a footer button — every route ends in
					one <code>vui:close</code> event with a <code>returnValue</code>.
				</p>
				<div class="row">
					<button type="button" data-on="click:basic"
						class="primary">basic</button>
					<button type="button"
						data-on="click:confirm">confirm (footer buttons)</button>
					<button type="button"
						data-on="click:form">form (method=dialog)</button>
					<button type="button"
						data-on="click:nested">nested component (data-scope)</button>
					<button type="button" data-on="click:nonmodal">non-modal</button>
					<button type="button"
						data-on="click:long">long content (scrolls)</button>
				</div>
				<pre class="log" data-ref="log"></pre>
			</section>
		</div>

		<!-- ------------------------------------------------ gallery-only templates -->

		<!-- dialog body for the "form" demo: <form method="dialog"> closes the dialog
		     with the submit button's value as returnValue — pure platform. -->
		<template id="tpl-gallery-form">
			<form method="dialog">
				<label for="g-name">Your name</label>
				<input id="g-name" name="name" type="text" autofocus placeholder="Ada" />
				<div class="row" style="justify-content: flex-end; margin: 1rem 0 0">
					<button type="submit" value="cancel">Cancel</button>
					<button type="submit" value="save" class="primary">Save</button>
				</div>
			</form>
		</template>

		<!-- a tiny NESTED component: its root carries data-scope, and it deliberately
		     names an action "close" — the same name the dialog uses. With the scope
		     boundary, the dialog's delegate ignores it; only the counter resets. -->
		<template id="tpl-gallery-counter">
			<div class="demo-counter" data-scope="counter">
				<button type="button" data-on="click:dec">−</button>
				<output data-ref="value">0</output>
				<button type="button" data-on="click:inc">+</button>
				<button type="button"
					data-on="click:close">reset (action named “close”)</button>
			</div>
		</template>

		<template id="tpl-gallery-long">
			<div>
				<p data-ref="p"></p>
			</div>
		</template>

		<script type="module">
		import {
			createView,
			delegate,
			enhance,
			fromTemplate,
			loadAll,
			observable,
			refs,
		} from "@marianmeres/vanilla-ui";

		/* ---- theme picker + dark toggle (gallery chrome) ------------------- */
		const THEMES = [
			"zinc",
			"slateTealOcean",
			"indigoAmber",
			"emeraldPink",
			"monokaiGreen",
			"redSky",
		];
		const toKebab = (s) => s.replace(/([A-Z])/g, "-$1").toLowerCase();
		const link = document.getElementById("theme-link");
		const select = document.getElementById("theme-select");
		for (const name of THEMES) {
			const o = document.createElement("option");
			o.value = `${toKebab(name)}.css`;
			o.textContent = name;
			select.append(o);
		}
		select.value = link.getAttribute("href").split("/").pop();
		const persist = () =>
			localStorage.setItem(
				"vui-gallery-theme",
				JSON.stringify({
					file: select.value,
					dark: document.documentElement.classList.contains("dark"),
				}),
			);
		select.addEventListener("change", () => {
			link.setAttribute("href", `./themes/${select.value}`);
			persist();
		});
		document.getElementById("dark-toggle").addEventListener("click", () => {
			document.documentElement.classList.toggle("dark");
			persist();
		});

		/* ---- load the kit: ONE await, then mount at will -------------------- */
		const ui = await loadAll();

		/* ---- a nested demo component (gallery-local) ------------------------ */
		function createCounter() {
			return createView((track) => {
				const el = fromTemplate("tpl-gallery-counter");
				const r = refs(el);
				const n = observable(0);
				track(n.subscribe((v) => (r.value.value = String(v))));
				track(
					delegate(el, {
						inc: () => n.update((v) => v + 1),
						dec: () => n.update((v) => v - 1),
						close: () => n.set(0), // same action NAME as the dialog's ✕ — no collision
					}),
				);
				return { el };
			});
		}

		/* ---- dialog section ------------------------------------------------- */
		enhance("#dialog", (el, track) => {
			const r = refs(el);
			const log = (line) => {
				r.log.textContent += (r.log.textContent ? "\n" : "") + line;
				r.log.scrollTop = r.log.scrollHeight;
			};

			// Open a dialog, log its close, and destroy it afterwards — a
			// throwaway per open keeps the demo stateless. (A real app would
			// usually create one and open()/close() it repeatedly.)
			const show = (label, props) => {
				const dlg = ui.createDialog({
					...props,
					onClose: (v) => log(`${label} → onClose("${v}")`),
				});
				dlg.el.addEventListener("vui:close", (e) => {
					log(`${label} → vui:close  detail=${JSON.stringify(e.detail)}`);
					dlg.destroy();
				});
				document.body.append(dlg.el);
				dlg.open();
				return dlg;
			};

			const footerButtons = (dlg, ...defs) => {
				const box = document.createElement("div");
				box.className = "row";
				box.style.margin = "0";
				for (const [text, value, primary] of defs) {
					const b = document.createElement("button");
					b.type = "button";
					b.textContent = text;
					if (primary) b.className = "primary";
					b.addEventListener("click", () => dlg().close(value));
					box.append(b);
				}
				return box;
			};

			track(
				delegate(el, {
					basic: () =>
						show("basic", {
							title: "Hello",
							body: "A plain-text body. Close me with ✕, Esc, or the backdrop.",
						}),

					confirm: () => {
						let dlg;
						dlg = show("confirm", {
							title: "Delete 3 items?",
							body: "This cannot be undone.",
							closeOnBackdrop: false,
							footer: footerButtons(
								() => dlg,
								["Keep", "keep"],
								["Delete", "delete", true],
							),
						});
					},

					form: () =>
						show("form", {
							title: "Sign up",
							body: fromTemplate("tpl-gallery-form"),
						}),

					nested: () =>
						show("nested", {
							title: "A child view inside",
							body: createCounter(), // a VIEW: mounted + destroyed with the dialog
						}),

					nonmodal: () =>
						show("non-modal", {
							title: "Non-modal",
							body: "No backdrop, no focus trap — the page stays interactive.",
							modal: false,
						}),

					long: () => {
						const node = fromTemplate("tpl-gallery-long");
						refs(node).p.textContent = "Lorem ipsum dolor sit amet. ".repeat(160);
						show("long", { title: "Scrolling body", body: node });
					},
				}),
			);
		});
		</script>
	</body>
</html>
