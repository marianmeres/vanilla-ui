<!doctype html>
<!--
	Browser test for components/dialog.html — run by `deno task test:browser`
	(scripts/browser-test.ts drives headless Chrome and reads #result).

	Contract: one line per check — `ok <name>` / `FAIL <name> (detail)` — and a
	final `DONE` (or `ERROR …` on an uncaught exception).
-->
<html>
	<head>
		<meta charset="utf-8" />
		<title>dialog · browser test</title>
		<link rel="icon" href="data:," />
		<script type="importmap">
		{
			"imports": {
				"@marianmeres/vanilla": "../../dist/mod.js",
				"@marianmeres/vanilla-ui": "../../dist/mod.js"
			}
		}
		</script>
	</head>
	<body>
		<!-- a two-token fake theme: with no theme at all every fallback is a system
		     color, and ButtonFace is exactly what a UA-styled <button> already has —
		     so nothing below could tell "styled by the kit" from "not styled". -->
		<style>
		:root {
			--vui-color-surface-1: rgb(1, 2, 3);
			--vui-color-surface-1-foreground: rgb(4, 5, 6);
			--vui-color-success: rgb(7, 8, 9);
			--vui-color-success-foreground: rgb(10, 11, 12);
		}
		</style>

		<pre id="result"></pre>

		<!-- a nested child component whose action is ALSO named "close" -->
		<template id="tpl-child">
			<div data-scope="child"><button data-on="click:close">x</button></div>
		</template>

		<script type="module">
		import {
			BASE_STYLES_ID,
			button,
			createView,
			delegate,
			fromTemplate,
			loadAll,
		} from "@marianmeres/vanilla-ui";

		const out = [];
		const check = (name, cond, detail = "") =>
			out.push(cond ? `ok ${name}` : `FAIL ${name}${detail ? ` (${detail})` : ""}`);
		const flush = () => (document.getElementById("result").textContent = out.join("\n"));
		// the native `close` event is async — wait for it, never guess with a timer
		const closed = (d) =>
			new Promise((r) =>
				d.el.addEventListener("close", () => setTimeout(r, 0), { once: true })
			);

		try {
			const { createDialog } = await loadAll();
			check("styles adopted", !!document.querySelector("style[data-vanilla-src]"));
			check("template adopted", !!document.getElementById("tpl-vui-dialog"));

			/* ---- the base layer (components/base.css) ------------------------ */
			const base = document.getElementById(BASE_STYLES_ID);
			check("base styles installed", !!base);
			// it declares `@layer vui.base, vui.components;` — that statement only
			// orders the layers if it comes FIRST in document order
			check(
				"base styles precede the component styles",
				!!(base.compareDocumentPosition(
					document.querySelector("style[data-vanilla-src]"),
				) &
					Node.DOCUMENT_POSITION_FOLLOWING),
			);
			check(
				"button(): classes",
				button("x", { variant: "primary" }).className === "vui-btn vui-btn--primary",
				button("x", { variant: "primary" }).className,
			);
			check("button(): type defaults to button", button("x").type === "button");
			for (const v of ["primary", "accent", "destructive", "warning", "success", "ghost"]) {
				const cls = button("x", { variant: v }).className;
				check(`button(): variant ${v}`, cls === `vui-btn vui-btn--${v}`, cls);
			}
			let clicked = 0;
			const probe = button("x", { onClick: () => clicked++ });
			probe.click();
			check("button(): onClick", clicked === 1);

			/* ---- open, chrome, slots ---------------------------------------- */
			const seen = [];
			const dlg = createDialog({
				title: "T",
				body: "B",
				footer: "F",
				onClose: (v) => seen.push("cb:" + v),
			});
			dlg.el.addEventListener("vui:close", (e) => seen.push("ev:" + e.detail.returnValue));
			document.body.append(dlg.el);
			dlg.open();
			check("open(): el.open", dlg.el.open);
			check("open(): isOpen", dlg.isOpen.get() === true);
			check("title bound", dlg.el.querySelector(".vui-dialog__title").textContent === "T");
			check(
				"body text slot",
				dlg.el.querySelector(".vui-dialog__body").textContent === "B",
			);
			check(
				"footer shown when given",
				dlg.el.querySelector(".vui-dialog__footer").hidden === false,
			);
			check(
				"aria-labelledby",
				dlg.el.getAttribute("aria-labelledby") ===
					dlg.el.querySelector(".vui-dialog__title").id,
			);
			check("data-scope on root", dlg.el.dataset.scope === "dialog");

			/* ---- controls are painted by the base layer, not by the dialog ---- */
			const x = dlg.el.querySelector(".vui-dialog__close");
			check("✕ is a base control", x.classList.contains("vui-btn"));
			check("✕ is round (.vui-btn--icon)", getComputedStyle(x).borderRadius === "50%");
			check("✕ has the base cursor", getComputedStyle(x).cursor === "pointer");
			// the CONTEXT variable: the panel lifts every control inside it one step
			check(
				"panel declares --vui-control-bg",
				getComputedStyle(dlg.el.querySelector(".vui-dialog__panel"))
					.getPropertyValue("--vui-control-bg").trim() !== "",
			);
			// a BARE consumer button in a slot — no classes at all — is styled
			const bareBtn = document.createElement("button");
			bareBtn.textContent = "b";
			dlg.el.querySelector(".vui-dialog__body").append(bareBtn);
			const bareCs = getComputedStyle(bareBtn);
			// inline-flex is the base layer's; a UA button is inline-block
			check(
				"bare <button> in a slot is laid out by the base layer",
				bareCs.display === "inline-flex",
				bareCs.display,
			);
			// and it takes the PANEL's context variables — the container hook, the
			// context var and inheritance, all in one assertion
			check(
				"bare <button> in a slot takes the panel's --vui-control-bg",
				bareCs.backgroundColor === "rgb(1, 2, 3)",
				bareCs.backgroundColor,
			);
			check(
				"bare <button> in a slot takes the panel's --vui-control-foreground",
				bareCs.color === "rgb(4, 5, 6)",
				bareCs.color,
			);
			check(
				"✕ stays transparent (.vui-btn--ghost) on that same surface",
				getComputedStyle(x).backgroundColor === "rgba(0, 0, 0, 0)",
				getComputedStyle(x).backgroundColor,
			);
			bareBtn.remove();

			// a variant is a context re-declaration ON THE BUTTON, so it beats the
			// panel's context — and it resolves all the way from the design token
			const okBtn = button("ok", { variant: "success" });
			dlg.el.querySelector(".vui-dialog__body").append(okBtn);
			const okCs = getComputedStyle(okBtn);
			check(
				"variant beats the container context (bg)",
				okCs.backgroundColor === "rgb(7, 8, 9)",
				okCs.backgroundColor,
			);
			check(
				"variant beats the container context (fg)",
				okCs.color === "rgb(10, 11, 12)",
				okCs.color,
			);
			okBtn.remove();

			/* ---- structural tiers + lazy context defaults --------------------- */
			check(
				"dialog uses the container radius tier (--vui-radius-container)",
				getComputedStyle(dlg.el).borderRadius === "12px",
				getComputedStyle(dlg.el).borderRadius,
			);
			// the context channel's defaults resolve AT THE CONTROL: a subtree that
			// overrides a vocabulary name reaches the bare buttons inside it. With
			// the defaults declared at :root this is impossible — they substitute
			// their var()s there, eagerly, and the override never gets a look in.
			const sub = document.createElement("div");
			sub.className = "vui-row";
			sub.style.setProperty("--vui-surface", "rgb(13, 14, 15)");
			const subBtn = document.createElement("button");
			subBtn.textContent = "s";
			const subSel = document.createElement("select");
			subSel.append(new Option("one"));
			sub.append(subBtn, subSel);
			document.body.append(sub);
			const subCs = getComputedStyle(subBtn);
			check(
				"context defaults resolve at the control, not at :root",
				subCs.backgroundColor === "rgb(13, 14, 15)",
				subCs.backgroundColor,
			);
			// min-height is the alignment: on padding alone a <select> is 4px short
			const bh = subBtn.getBoundingClientRect().height;
			const sh = subSel.getBoundingClientRect().height;
			check(
				"<select> and <button> come out the same height",
				Math.abs(bh - sh) < 0.5,
				`${bh} vs ${sh}`,
			);
			check(
				"controls transition on --vui-transition",
				subCs.transitionDuration.startsWith("0.15s"),
				subCs.transitionDuration,
			);
			sub.remove();

			/* ---- every way to close -> one close, right returnValue ---------- */
			let w = closed(dlg);
			dlg.el.querySelector(".vui-dialog__close").click();
			check("✕: el.open false synchronously", !dlg.el.open);
			check("✕: isOpen false synchronously", dlg.isOpen.get() === false);
			await w;
			check(
				"✕ -> 'close' (callback + event)",
				seen.join() === "cb:close,ev:close",
				seen.join(),
			);

			seen.length = 0;
			dlg.open();
			w = closed(dlg);
			dlg.close("custom");
			await w;
			check("close('custom')", seen.join() === "cb:custom,ev:custom", seen.join());

			seen.length = 0;
			dlg.open();
			w = closed(dlg);
			dlg.el.dispatchEvent(new MouseEvent("click", { bubbles: true })); // target === <dialog>
			await w;
			check(
				"backdrop click -> 'backdrop'",
				seen.join() === "cb:backdrop,ev:backdrop",
				seen.join(),
			);

			seen.length = 0;
			dlg.open();
			w = closed(dlg);
			dlg.el.dispatchEvent(new Event("cancel")); // Esc: cancel, then native close
			dlg.el.close();
			await w;
			check(
				"Esc (cancel event) -> 'cancel'",
				seen.join() === "cb:cancel,ev:cancel",
				seen.join(),
			);

			seen.length = 0;
			dlg.open();
			w = closed(dlg);
			dlg.el.close(); // Esc without a cancel event: must not inherit a stale value
			await w;
			check(
				"close with no value -> 'cancel', never stale",
				seen.join() === "cb:cancel,ev:cancel",
				seen.join(),
			);

			seen.length = 0;
			dlg.open();
			dlg.el.querySelector(".vui-dialog__panel").click();
			await new Promise((r) => setTimeout(r, 30));
			check("click inside the panel does not close", dlg.el.open && seen.length === 0);
			w = closed(dlg);
			dlg.close();
			await w;

			/* ---- options ------------------------------------------------------ */
			const noBackdrop = createDialog({ title: "x", closeOnBackdrop: false });
			document.body.append(noBackdrop.el);
			noBackdrop.open();
			noBackdrop.el.dispatchEvent(new MouseEvent("click", { bubbles: true }));
			await new Promise((r) => setTimeout(r, 30));
			check("closeOnBackdrop:false keeps it open", noBackdrop.el.open);
			noBackdrop.destroy();

			const bare = createDialog({ closeButton: false });
			document.body.append(bare.el);
			check(
				"no title + no ✕ -> header hidden",
				bare.el.querySelector(".vui-dialog__header").hidden,
			);
			check(
				"footer hidden when omitted",
				bare.el.querySelector(".vui-dialog__footer").hidden,
			);
			bare.destroy();

			const nonModal = createDialog({ title: "nm", modal: false });
			document.body.append(nonModal.el);
			nonModal.open();
			check("modal:false uses show()", nonModal.el.open && !nonModal.el.matches(":modal"));
			nonModal.destroy();

			/* ---- placement: a drawer is this dialog with a margin ------------- */
			// the entry animation slides the box in from its edge, so geometry is
			// only the final geometry once it is off — unlayered + !important, the
			// same escape hatch a consumer has
			const noAnim = document.createElement("style");
			noAnim.textContent = ".vui-dialog { animation: none !important; }";
			document.head.append(noAnim);
			const near = (a, b) => Math.abs(a - b) <= 1;

			const centered = createDialog({ title: "c" });
			document.body.append(centered.el);
			check("placement defaults to center", centered.el.dataset.placement === "center");
			centered.destroy();

			const bogus = createDialog({ title: "b", placement: "sideways" });
			check(
				"an unknown placement falls back to center",
				bogus.el.dataset.placement === "center",
			);
			bogus.destroy();

			for (
				const [placement, edge] of [
					["start", (r) => near(r.left, 0)],
					["end", (r) => near(r.right, innerWidth)],
					["top", (r) => near(r.top, 0)],
					["bottom", (r) => near(r.bottom, innerHeight)],
				]
			) {
				const d = createDialog({ title: placement, placement });
				document.body.append(d.el);
				d.open();
				const r = d.el.getBoundingClientRect();
				check(`placement:${placement} is stamped`, d.el.dataset.placement === placement);
				check(
					`placement:${placement} is fixed`,
					getComputedStyle(d.el).position === "fixed",
				);
				check(`placement:${placement} sits on its edge`, edge(r), JSON.stringify(r));
				check(
					`placement:${placement} fills the cross axis`,
					placement === "start" || placement === "end"
						? near(r.height, innerHeight)
						: near(r.width, innerWidth),
					`${r.width}x${r.height} vs ${innerWidth}x${innerHeight}`,
				);
				d.destroy();
			}

			// the reason `position: fixed` is declared rather than inherited from the
			// UA: a NON-MODAL <dialog> is `absolute` per the UA sheet, so a drawer
			// opened with show() would otherwise hang off its offset parent
			const offsetParent = document.createElement("div");
			offsetParent.style.cssText = "position: relative; margin-left: 40px; width: 100px";
			document.body.append(offsetParent);
			const sidePanel = createDialog({ title: "sp", modal: false, placement: "end" });
			offsetParent.append(sidePanel.el);
			sidePanel.open();
			check(
				"a non-modal drawer pins to the viewport, not its offset parent",
				near(sidePanel.el.getBoundingClientRect().right, innerWidth),
				JSON.stringify(sidePanel.el.getBoundingClientRect()),
			);
			check("…and is still non-modal", !sidePanel.el.matches(":modal"));
			sidePanel.destroy();
			offsetParent.remove();
			noAnim.remove();

			/* ---- element + view slots, nesting, destroy cascade -------------- */
			const node = document.createElement("p");
			node.textContent = "E";
			const withEl = createDialog({ body: node });
			check("body element slot", withEl.el.querySelector(".vui-dialog__body p") === node);
			withEl.destroy();

			const child = createView((track) => {
				const el = fromTemplate("tpl-child");
				let hits = 0;
				track(delegate(el, { close: () => hits++ }));
				return { el, hits: () => hits };
			});
			const d2 = createDialog({ body: child });
			document.body.append(d2.el);
			d2.open();
			child.el.querySelector("button").click();
			await new Promise((r) => setTimeout(r, 30));
			check("nested data-scope: child 'close' does not close the dialog", d2.el.open);
			check("nested data-scope: child's own delegate fired", child.hits() === 1);
			d2.destroy();
			check("destroy(): root removed", !d2.el.isConnected);
			check("destroy(): mounted child view removed too", !child.el.isConnected);
			check("destroy(): isOpen false", d2.isOpen.get() === false);

			/* ---- layers: a consumer's own (unlayered) CSS beats all of it ----- */
			const probeStyle = document.createElement("style");
			// an ELEMENT selector (0,0,1) against the base layer's `.vui-btn` (0,1,0):
			// it can only win because layered styles lose to unlayered ones, never on
			// specificity — so this passes if and only if the layering works
			probeStyle.textContent = "button { padding: 33px; }";
			document.head.append(probeStyle);
			const pb = button("p");
			document.body.append(pb);
			check(
				"unlayered consumer CSS beats the base layer (layers, not specificity)",
				getComputedStyle(pb).padding === "33px",
				getComputedStyle(pb).padding,
			);
			pb.remove();
			probeStyle.remove();

			out.push("DONE");
		} catch (e) {
			out.push("ERROR " + (e && e.stack || e));
		}
		flush();
		</script>
	</body>
</html>
